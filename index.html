<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>워크샵 팀 대항전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: workshop control board — header, main tabs (종합 / 조 편성 / 타이머 / 프로그램 / 설정); A·B group colors run through every view; the timer is a fixed black-and-red scoreboard */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunken:#F5F7FA; --ink:#141B2B; --muted:#5A6375; --line:#D5DBE4;
  --accent:#F0561D; --accent-ink:#FFFFFF; --a:#2459C9; --b:#0B8E7C; --on-g:#FFFFFF;
  --gold:#B88A00; --gold-soft:#FBF1CF; --silver:#7C8698; --bronze:#A95A28;
  --ok:#1E8E4E; --ok-soft:#DFF3E7; --warn:#B76E00; --warn-soft:#FBEBD3; --bad:#C63434; --bad-soft:#F8E0E0;
  --mgr:#6B3FC7; --snr:#2459C9; --jnr:#0B8E7C;
  /* scoreboard: one look in both themes */
  --tv-bg:#000000; --tv-red:#FF2B2B; --tv-red-dim:#4A0B0B; --tv-ink:#E9E9E9; --tv-muted:#8A8A8A; --tv-line:#262626; --tv-btn:#121212;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --led:"Share Tech Mono","IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121B; --surface:#151C28; --sunken:#111722; --ink:#E7ECF4; --muted:#97A1B3; --line:#283244;
  --accent:#FF7440; --accent-ink:#1A0E08; --a:#7AA2FF; --b:#3DCBB3; --on-g:#0D121B;
  --gold:#E6C04A; --gold-soft:#3A3115; --silver:#A9B2C2; --bronze:#D98C55;
  --ok:#4FCB83; --ok-soft:#14321F; --warn:#F0A940; --warn-soft:#3A2A10; --bad:#F27272; --bad-soft:#3D1A1A;
  --mgr:#B494FF; --snr:#7AA2FF; --jnr:#3DCBB3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121B; --surface:#151C28; --sunken:#111722; --ink:#E7ECF4; --muted:#97A1B3; --line:#283244;
  --accent:#FF7440; --accent-ink:#1A0E08; --a:#7AA2FF; --b:#3DCBB3; --on-g:#0D121B;
  --gold:#E6C04A; --gold-soft:#3A3115; --silver:#A9B2C2; --bronze:#D98C55;
  --ok:#4FCB83; --ok-soft:#14321F; --warn:#F0A940; --warn-soft:#3A2A10; --bad:#F27272; --bad-soft:#3D1A1A;
  --mgr:#B494FF; --snr:#7AA2FF; --jnr:#3DCBB3; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;gap:18px}
#app{display:grid;gap:18px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
.mono,.t{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input:disabled,select:disabled{background:var(--sunken);color:var(--muted)}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,42px);line-height:1.1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--ok)} .sync.local i{background:var(--warn)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--display);font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip[aria-pressed="true"] b{color:var(--accent)}

.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:grid;gap:2px}
.stage .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.stage .v{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stage .bar{height:4px;border-radius:2px;background:var(--sunken);margin-top:6px;overflow:hidden}
.stage .bar b{display:block;height:100%;background:var(--sc,var(--accent))}
.stage.ga{--sc:var(--a)} .stage.gb{--sc:var(--b)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:center}
.gtag{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;font-family:var(--display);font-weight:400;font-size:14px;color:var(--on-g);flex:none}
.gtag.A{background:var(--a)} .gtag.B{background:var(--b)} .gtag.F,.gtag.W{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted)}
p.note{margin:0}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.acc{background:var(--accent);color:var(--accent-ink)}

.stand{display:grid;gap:6px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--sunken)}
.row.q{background:var(--gold-soft)}
.rk{font-family:var(--display);font-size:22px;line-height:1;text-align:center;color:var(--muted)}
.row.q .rk{color:var(--gold)}
.nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;text-align:right}
.tt small{display:block;font-size:11px;font-weight:500;color:var(--muted)}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.pod{border-radius:8px;padding:12px;text-align:center;display:grid;gap:4px;background:var(--sunken);border-top:4px solid var(--pc)}
.pod.p1{--pc:var(--gold);padding-block:22px} .pod.p2{--pc:var(--silver);padding-block:14px} .pod.p3{--pc:var(--bronze)}
.pod .rk{color:var(--pc)}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.slot.on{border-style:solid;background:var(--sunken)}
.slot .src{font-size:12px;font-weight:600;color:var(--muted);width:72px}

/* leaderboard */
.lb th.c,.lb td.c{text-align:center}
.lb td{font-variant-numeric:tabular-nums}
.lb tr.top1 td{background:var(--gold-soft)}
.lb .sum{font-family:var(--mono);font-weight:600;font-size:18px;text-align:right}
.lb .meter{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;min-width:80px}
.lb .meter b{display:block;height:100%;background:var(--accent);border-radius:3px}
.progs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;text-align:left}
.prog .n{font-family:var(--display);font-size:22px;color:var(--accent);line-height:1}
.prog strong{font-size:15px}

/* teams */
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:980px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.teams{grid-template-columns:minmax(0,1fr)}}
.teams .card{padding:14px 12px}
.team{border-top:4px solid var(--gc)}
.team.A{--gc:var(--a)} .team.B{--gc:var(--b)}
.team .name{font-size:17px;font-weight:700;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button[aria-pressed="true"].A{background:var(--a);color:var(--on-g)}
.seg button[aria-pressed="true"].B{background:var(--b);color:var(--on-g)}
.mem{display:grid;grid-template-columns:18px minmax(0,.75fr) minmax(0,1.25fr) 70px 24px;gap:4px;align-items:center}
.mem input,.mem select{padding:6px 5px;font-size:13px}
.mem select{padding-inline:3px}
.mem .x{width:24px;height:30px}
.mix.brands span{background:var(--sunken);border-radius:99px;padding:1px 8px}
.mix.brands span::before{display:none}
.mem select.r-매니저{color:var(--mgr);font-weight:600} .mem select.r-시니어{color:var(--snr);font-weight:600} .mem select.r-주니어{color:var(--jnr);font-weight:600}
.star{border:0;background:none;font-size:16px;color:var(--line);padding:0}
.star[aria-pressed="true"]{color:var(--gold)}
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:34px;color:var(--muted)}
.mix{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mix span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--dc)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.rec{min-width:720px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input.tin{width:100px;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{border:0;background:var(--sunken);width:30px;height:34px;font-weight:700}
.step span{min-width:34px;text-align:center;font-family:var(--mono)}
td.tot{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;text-align:right;white-space:nowrap}
td .sub{display:block;font-size:11px;color:var(--muted);font-weight:500}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}

.form{display:grid;gap:14px}
.fld{display:grid;gap:5px}
.fld label,.fld .lb{font-size:13px;font-weight:600}
.pts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pts label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.pts input{text-align:center;font-family:var(--mono)}
.rules{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* participants */
.rec tr:not(.pl-row) td{border-bottom:0;padding-bottom:4px}
.rec tr.pl-row td{padding-top:0}
.pl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pl-k{font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-right:4px}
.pl-chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;display:inline-flex;gap:5px;align-items:baseline;color:var(--muted)}
.pl-chip small{font-size:11px;opacity:.8}
.pl-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* bracket */
.brk{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.9fr) minmax(0,1fr);gap:56px}
.brk-lines{position:absolute;inset:0;pointer-events:none;overflow:visible}
.brk-lines .ln{fill:none;stroke:var(--line);stroke-width:2}
.brk-lines .ln.w{stroke-dasharray:5 5}
.brk-lines .ln.a.on{stroke:var(--a)} .brk-lines .ln.b.on{stroke:var(--b)} .brk-lines .ln.w.on{stroke:var(--accent)} .brk-lines .ln.f.on{stroke:var(--gold)}
.brk-col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1;min-width:0}
.brk-col.mid{justify-content:space-around}
.brk-h{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.brk-grp{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:8px;padding:10px;display:grid;gap:4px}
.brk-grp.A{--gc:var(--a)} .brk-grp.B{--gc:var(--b)}
.brk-gh{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-bottom:2px}
.brk-tm{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.brk-tm .rk{font-size:16px}
.brk-tm .nm{font-size:14px} .brk-tm .nm small{font-weight:400}
.brk-tm .tt{font-size:14px}
.brk-tm.win{background:var(--gold-soft)} .brk-tm.win .rk{color:var(--gold)}
.brk-tm.wild{box-shadow:inset 0 0 0 1.5px var(--accent)}
.brk-tm.dq{opacity:.55}
.brk-slot{background:var(--surface);border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.brk-slot.on{border-style:solid}
.brk-slot.A.on{border-color:var(--a)} .brk-slot.B.on{border-color:var(--b)} .brk-slot.W.on{border-color:var(--accent)}
.brk-slot .src{font-size:12px;font-weight:600;color:var(--muted)}
.brk-slot .nm{font-size:16px}
.brk-fin{display:grid;gap:6px;margin-block:auto}
.brk-champ{border-radius:10px;padding:14px;background:var(--sunken);border:1.5px dashed var(--line);display:grid;gap:4px;justify-items:start}
.brk-champ b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;color:var(--muted)}
.brk-champ.on{background:var(--gold-soft);border:1.5px solid var(--gold)} .brk-champ.on b{color:var(--ink)}
.brk-pl{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;background:var(--sunken)}
.brk-pl .rk{font-size:17px} .brk-pl.p1 .rk{color:var(--gold)} .brk-pl.p2 .rk{color:var(--silver)} .brk-pl.p3 .rk{color:var(--bronze)} .brk-pl.rest .rk{font-size:13px}
.brk-pl .nm{font-size:14px} .brk-pl .tt{font-size:14px}
@media (max-width:760px){.brk{grid-template-columns:1fr;gap:16px}.brk-lines{display:none}}

/* quiz */
.qz-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.qz-nav{display:flex;align-items:center;gap:12px}
.qz-nav .btn{padding:10px 14px}
.qz-no{display:flex;align-items:baseline;gap:6px}
.qz-no b{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;color:var(--accent)}
.qz-clock{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:10px;background:var(--sunken)}
.qz-clock .mono{font-size:30px;font-weight:600}
.qz-clock.warn .mono{color:var(--bad)}
.qz-clock.over .mono{color:var(--bad);animation:blink .6s steps(1) infinite}
.qz-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.qz-team{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.qz-team.ok{border-color:var(--ok);background:var(--ok-soft)} .qz-team.no{border-color:var(--bad);background:var(--bad-soft)}
.qz-ox{display:grid;grid-template-columns:1fr;gap:6px}
.qz-ox button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 6px;font-weight:700;font-size:15px}
.qz-ox button:first-child[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.qz-ox button:last-child[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.qz-bar{display:block;width:110px;height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.qz-bar b{display:block;height:100%;background:var(--accent)}
.qz-grid{min-width:640px}
.qz-grid th.c,.qz-grid td.c{text-align:center}
.qz-grid td,.qz-grid th{padding:4px 6px}
.qz-grid tr.cur{background:var(--sunken)}
.qz-grid tfoot td,.qz-grid tfoot th{border-top:2px solid var(--line);padding-top:8px}
.qz-cell{width:40px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700;color:var(--muted)}
.qz-cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .qz-cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qz-qbtn{border:0;background:none;font-family:var(--mono);font-weight:600;color:var(--ink);padding:2px 4px}
.qz-q{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:10px;background:var(--sunken)}
.qz-text{margin:0;font-size:clamp(17px,2.2vw,22px);font-weight:600;line-height:1.45;flex:1 1 320px;min-width:0;text-wrap:pretty}
.qz-text.none{font-size:14px;font-weight:400;color:var(--muted)}
.qz-ans{display:flex;gap:8px;align-items:center}
.qz-key{display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--muted)}
.qz-key b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--accent);min-width:32px;text-align:center}
.qz-live.bonus{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.qz-grid tr.bon th,.qz-grid tr.bon td{background:var(--warn-soft)}
.qz-qbtn small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--accent)}
.qz-items{min-width:560px}
.qz-items th{width:64px}

.p4card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}

.p4card small{display:block;color:var(--muted);font-size:12px}

.p4eval{min-width:640px}
.rub summary{display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}

.rubric{min-width:820px;margin-top:12px}

  }).sort((a,b) => b.sum - a.sum || a.i - b.i);
  let rank = 0, prev = null; rows.forEach((r,i) => { if (r.sum !== prev) { rank = i+1; prev = r.sum; } r.rank = rank; });
  return { rows, per };
}

/* ---------- persistence ---------- */
const queues = {};
function saveLocal(){ try { localStorage.setItem(LS_KEY+':web', JSON.stringify(state)); } catch(e){} }
function persist(path, obj){
  saveLocal();
  if (!db) return;
  queues[path] = (queues[path] || Promise.resolve()).then(() => db.doc(path).set(obj)).catch(e => {
    if (e && e.code === 'invalid_argument') { readOnly = true; toast('편집 권한이 없어 저장되지 않았습니다. 보기 전용으로 전환합니다.'); render(); }
    else if (e && e.code === 'unavailable') { setTimeout(() => db.doc(path).set(obj).catch(() => toast('저장하지 못했습니다. 잠시 후 다시 입력해 주세요.')), 600 + Math.random()*800); }
    else toast('저장하지 못했습니다: ' + (e && e.message || '알 수 없는 오류'));
  });
}
function setConfig(patch){ state.config = { ...cfg(), ...patch }; persist('meta/config', state.config); render(); }
function setTeam(id, patch){ state.teams[id] = { ...team(id), ...patch }; persist('teams/'+id, state.teams[id]); render(); }
function setRun(id, patch){ const r = { ...run(id), ...patch }; delete r.dis; delete r.asm; delete r.fix; state.runs[id] = r; persist('runs/'+id, r); render(); }
function setScore(pid, tid, v){ const p = { ...(state.scores[pid] || {}) }; if (v != null) p[tid] = v; else delete p[tid]; state.scores[pid] = p; persist('scores/'+pid, p); render(); }
function setMark(pid, tid, qid, v){ const all = { ...marksOf(pid) }, m = { ...(all[tid] || {}) }; if (v == null) delete m[qid]; else m[qid] = v; all[tid] = m; state[QZ[pid].mkey] = all; persist(QZ[pid].marks+'/'+tid, m); }
function saveItems(pid, items){ state[QZ[pid].skey] = { items: items.map(it => normItem(it, pid)) }; persist(QZ[pid].doc, state[QZ[pid].skey]); render(); }
function setItem(pid, qid, patch){ saveItems(pid, quizItems(pid).map(it => it.id === qid ? { ...it, ...patch } : it)); }
function stepQuiz(pid, d, to){ const act = activeItems(pid); ui.qids = ui.qids || {}; let i = act.findIndex(x => x.id === ui.qids[pid]); if (i < 0) i = 0; i = to != null ? act.findIndex(x => x.id === to) : Math.min(act.length-1, Math.max(0, i + d)); if (act[i]) ui.qids[pid] = act[i].id; QT.running = false; QT.left = null; QT.beeped = false; saveUi(); render(); }
function setP4Team(tid, patch, pid='p4'){ const k = EV[pid].teams; state[k] = { ...(state[k] || {}) }; state[k][tid] = { ...p4team(tid, pid), ...patch }; persist(k+'/'+tid, state[k][tid]); }
function setP4Score(eid, tid, v, pid='p4'){ const k = EV[pid].scores; state[k] = { ...(state[k] || {}) }; const d = { ...(state[k][eid] || {}) }; if (v == null) delete d[tid]; else d[tid] = v; state[k][eid] = d; persist(k+'/'+eid, d); render(); }
function saveEvals(list){ setConfig({ evaluators: list }); }

function parseTSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
function parseImport(text){
  const rows = parseTSV(text || ''); if (!rows.length) return null;
  let col = { no:0, kind:-1, q:1, a:2, pts:3 }, start = 0;
  const h = rows[0].map(x => x.replace(/\s/g,''));
  if (h.some(x => /질문|정답|문항|문제|곡명/.test(x))) {
    start = 1; col = { no:-1, kind:-1, q:-1, a:-1, pts:-1 };
    h.forEach((x,i) => { if (/정답|곡명|답/.test(x) && col.a < 0) col.a = i; else if (/번호|^No/i.test(x) && col.no < 0) col.no = i; else if (/구분|유형|종류/.test(x)) col.kind = i; else if (/질문|문제|문항|힌트/.test(x) && col.q < 0) col.q = i; else if (/배점|점수/.test(x)) col.pts = i; });
  } else if (rows.some(r => /^(일반|보너스)/.test(r[1] || ''))) col = { no:0, kind:1, q:2, a:3, pts:4 };
  const get = (r,i) => i >= 0 ? (r[i] || '') : '';
  const out = { reg:[], bonus:[] };
  rows.slice(start).forEach(r => {
    const it = { q:get(r,col.q), a:get(r,col.a), pts: parseFloat(get(r,col.pts)) };
    const isB = /보너스|bonus/i.test(get(r,col.kind)) || /보너스|^B/i.test(get(r,col.no));
    if (isB) out.bonus.push(it); else out.reg.push(it);
  });

}

const fmtSec = s => { const t = Math.ceil(s - 1e-6); return Math.floor(t/60) + ':' + p2(t % 60); };
function qtTick(){

function drawBracket(){
  const box = document.getElementById('brk'), svg = document.getElementById('brkSvg');
  if (!box || !svg || getComputedStyle(svg).display === 'none') return;
  const R = box.getBoundingClientRect(), node = k => box.querySelector(`[data-node="${k}"]`);
  const pt = (el, side) => { const r = el.getBoundingClientRect(); return [ (side === 'r' ? r.right : r.left) - R.left, r.top + r.height/2 - R.top ]; };
  svg.setAttribute('width', R.width); svg.setAttribute('height', R.height); svg.setAttribute('viewBox', `0 0 ${R.width} ${R.height}`);
  const path = (a, b2, cls) => { const xm = (a[0] + b2[0]) / 2; return `<path class="${cls}" d="M${a[0]} ${a[1]} H${xm} V${b2[1]} H${b2[0]}"/>`; };
  const gA = node('gA'), gB = node('gB'), sA = node('sA'), sW = node('sW'), sB = node('sB'), fin = node('fin');
  if (!gA || !gB || !sA || !sW || !sB || !fin) return;
  const on = el => el.classList.contains('on') ? ' on' : '';
  let d = path(pt(gA,'r'), pt(sA,'l'), 'ln a'+on(sA)) + path(pt(gB,'r'), pt(sB,'l'), 'ln b'+on(sB));
  const ga = pt(gA,'r'), gb = pt(gB,'r'); d += path([ga[0], ga[1]+14], pt(sW,'l'), 'ln w'+on(sW)) + path([gb[0], gb[1]-14], pt(sW,'l'), 'ln w'+on(sW));
  [sA, sW, sB].forEach(s => d += path(pt(s,'r'), pt(fin,'l'), 'ln f'+on(s)));
  svg.innerHTML = d;
}
window.addEventListener('resize', () => requestAnimationFrame(drawBracket));
function standCard(g, rows, b){

    const t = team(x.id);
    let pill = '<span class="pill">기록 대기</span>', q = false;
    if (x.dq) pill = '<span class="pill bad">실격</span>';
    else if (x.t != null && x === rows[0]) { pill = `<span class="pill gold">결승 진출${rows.complete?'':' (잠정)'}</span>`; q = true; }
    else if (b.wild && b.wild.id === x.id) { pill = `<span class="pill acc">와일드카드${b.A.complete && b.B.complete ? '' : ' (잠정)'}</span>`; q = true; }

    return `<div class="row ${q?'q':''}"><span class="rk">${x.rank ?? '–'}</span>
      <span class="nm">${esc(t.name)}<small>${t.members.filter(m=>m.name).length}명${t.leader>=0 && t.members[t.leader]?.name ? ' · 팀장 '+esc(t.members[t.leader].name) : ''}</small></span>

function playersCell(rid, id, dis){

  const rk = nm => (t.members.find(m => m.name === nm) || {}).rank;
  return `<div class="pl"><span class="pl-k">참가자 ${pill}</span>${[...names, ...extra].map(nm => `<button class="pl-chip" data-act="player" data-id="${rid}" data-name="${esc(nm)}" aria-pressed="${sel.includes(nm)}" ${dis}>${esc(nm)}${rk(nm) ? `<small>${rk(nm)}</small>` : ''}</button>`).join('')}</div>`;
}

const T = { mode:'sw', duration:300, limit:0, running:false, base:0, startPerf:0, stage:'A', sound:true, fx:true, light:false, p4cur:'', fired:{}, lvl:'', laps:[] };
try { const s = JSON.parse(localStorage.getItem(LS_KEY+':tv') || 'null'); if (s) Object.assign(T, { mode:s.mode||'sw', duration:s.duration||300, limit:s.limit||0, sound:s.sound!==false, fx:s.fx!==false, light:!!s.light, p4cur:s.p4cur||'', laps:s.laps||[], stage:s.stage||'A' }); } catch(e){}

const nowS = () => performance.now() / 1000;
const elapsed = () => T.base + (T.running ? nowS() - T.startPerf : 0);
const span = () => T.mode === 'cd' ? T.duration : T.limit;
const remaining = () => span() ? span() - elapsed() : null;
const started = () => T.running || T.base > 0;
const THS = [300, 180, 60, 0];

let actx = null;
function beep(n, long){
  if (!T.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    for (let i = 0; i < n; i++) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = long ? 660 : 990;
      const st = t0 + i*0.32, d = long ? 1.4 : 0.18;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.25, st+0.01); g.gain.exponentialRampToValueAtTime(0.0001, st+d);
      o.connect(g).connect(actx.destination); o.start(st); o.stop(st+d+0.05);
    }
  } catch(e){}
}

function fx(th){

  const bn = $('#tvBanner'); bn.textContent = msg; bn.hidden = false; bn.style.animation = 'none'; void bn.offsetWidth; bn.style.animation = '';
  clearTimeout(bannerT); bannerT = setTimeout(() => bn.hidden = true, th ? 4000 : 6000);
  const fl = $('#tvFlash'); fl.className = 'tv-flash'; void fl.offsetWidth; fl.className = 'tv-flash ' + (th === 300 ? 'go' : th === 180 ? 'go3' : 'go1');
  beep(th === 300 ? 1 : th === 180 ? 2 : th === 60 ? 3 : 1, th === 0);
  if (ui.tab !== 'timer') toast('타이머: ' + msg);
}

  if (lvl !== T.lvl) { T.lvl = lvl; $('#timerView').className = 'tv ' + lvl + (T.light ? ' light' : ''); updLabel(); }

}
function loop(){ tick(); requestAnimationFrame(loop); }
setInterval(tick, 250);
function updLabel(){
  const R = remaining();

  if (R != null && started()) { if (R <= 0) t = T.mode === 'cd' ? 'TIME OVER' : '제한 시간 초과'; else if (!T.fx) {} else if (R <= 60) t += ' · 1분 이내'; else if (R <= 180) t += ' · 3분 이내'; else if (R <= 300) t += ' · 5분 이내'; }
  $('#tvLabel').textContent = t;
}
function updCtrl(){
  const done = T.mode === 'cd' && T.base >= T.duration;
  $('#tvStart').textContent = T.running ? '일시정지' : started() ? (done ? '종료' : '계속') : '시작';

  $('#tvFx').textContent = T.fx ? '효과 켬' : '효과 끔'; $('#tvLight').textContent = T.light ? '어두운 화면' : '밝은 화면'; $('#tvSound').disabled = !T.fx;
  document.querySelectorAll('#tvMode button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.v === T.mode); b.disabled = started(); });

}
function renderTvSet(){
  const lock = started() ? 'disabled' : '';

    $('#tvSet').innerHTML = `<span>시간</span>${presets.map(m => `<button data-tv="dur" data-v="${m*60}" aria-pressed="${T.duration===m*60}" ${lock}>${m}분</button>`).join('')}

  } else {
    $('#tvSet').innerHTML = `<span>제한 시간</span><button data-tv="lim" data-v="0" aria-pressed="${!T.limit}" ${lock}>없음</button>${presets.slice(1).map(m => `<button data-tv="lim" data-v="${m*60}" aria-pressed="${T.limit===m*60}" ${lock}>${m}분</button>`).join('')}`;
  }
}
const stageLabel = s => s === 'A' ? '예선 A조' : s === 'B' ? '예선 B조' : s === 'P4' ? '노하우 발표' : '결승';
const linkedTime = rid => rid.startsWith('P4-') ? p4team(rid.slice(3)).time : run(rid).time;
const ridTeam = rid => rid.slice(rid.indexOf('-')+1);
function stageTeams(s){
  if (s === 'P4') return p4order().map(id => { const x = p4team(id); return { id, rid:'P4-'+id, sub:`${x.order}번${x.presenter ? ' · '+x.presenter : ''}` }; });

}
function renderTvStage(){
  $('#tvStage').innerHTML = ['A','B','F','P4'].map(s => `<button class="chip" data-tv="stage" data-v="${s}" aria-pressed="${T.stage===s}">${stageLabel(s)}</button>`).join('');
}
function renderTvTeams(){
  if (ui.tab !== 'timer') return;
  const list = stageTeams(T.stage), off = !started() || readOnly ? 'disabled' : '';
  $('#tvTeams').innerHTML = list.length ? list.map((x,i) => { const r = { time: linkedTime(x.rid) };
    return `<button class="tv-team" data-tv="team" data-rid="${x.rid}" ${off}><span class="k">${i+1} · ${esc(x.sub)}</span><b>${esc(team(x.id).name)}</b>
      ${r.time != null ? `<span class="v">${fmt(r.time)}</span>` : '<span class="v none">미기록 · 눌러서 기록</span>'}</button>`; }).join('')
    : `<div class="tv-help">${T.stage === 'F' ? '예선 결과가 나오면 결승 진출 3팀이 여기에 표시됩니다.' : '이 조에 배정된 팀이 없습니다.'}</div>`;
  renderTvNow();
}
function renderTvNow(){
  const el = $('#tvNow'), sel = $('#tvP4');
  if (sel) sel.hidden = T.stage !== 'P4';
  if (sel && T.stage === 'P4') sel.innerHTML = `<option value="">발표 팀 표시 안 함</option>` + p4order().map(id => `<option value="${id}" ${T.p4cur===id?'selected':''}>${p4team(id).order}번 · ${esc(team(id).name)}</option>`).join('');
  if (T.stage !== 'P4' || !T.p4cur) { el.hidden = true; return; }
  const x = p4team(T.p4cur);
  el.hidden = false; el.innerHTML = `<span>${x.order}번 발표 · ${esc(team(T.p4cur).name)}${x.presenter ? ' · '+esc(x.presenter) : ''}</span>${x.title ? `<b>${esc(x.title)}</b>` : ''}`;
}
function openP4Timer(tid){
  T.stage = 'P4'; if (tid) T.p4cur = tid;
  T.light = true; T.lvl = '_';
  if (!started()) { T.mode = 'cd'; T.duration = cfg().p4sec; T.fx = false; }
  else if (tid) toast('타이머가 이미 돌고 있습니다. 초기화 후 다시 시작하세요.');
  saveTv(); ui.tab = 'timer'; saveUi(); render(); updCtrl(); window.scrollTo({top:0});
}
function ridOptions(sel, stage){
  const opts = stageTeams(stage).map(x => [x.rid, `${stageLabel(stage)} · ${team(x.id).name}`]);
  return `<option value="">팀 선택 안 함</option>` + opts.map(([v,l]) => `<option value="${v}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');
}
const lapStage = l => l.stage || (l.rid ? (l.rid.startsWith('P4-') ? 'P4' : l.rid[0] === 'F' ? 'F' : team(ridTeam(l.rid)).group) : T.stage);
function renderTvLaps(){
  const mine = T.laps.filter(l => lapStage(l) === T.stage), hidden = T.laps.length - mine.length;
  const more = hidden ? `<div class="tv-help">다른 단계 기록 ${hidden}개는 숨겨져 있습니다. 위에서 해당 단계를 고르면 보입니다.</div>` : '';
  if (!mine.length) { $('#tvLaps').innerHTML = `<div class="tv-help">${stageLabel(T.stage)} 진행 중 <b>기록 남기기</b>나 팀 버튼을 누르면 여기에 쌓입니다. 나중에 ${stageLabel(T.stage)} 팀 중에서 골라 연동할 수 있습니다.</div>` + more; return; }
  const rem = mine.some(l => l.rem != null);
  $('#tvLaps').innerHTML = `<table><thead><tr><th>#</th><th>기록</th>${rem?'<th>남은 시간</th>':''}<th>${esc(stageLabel(T.stage))} 팀 연동</th><th></th></tr></thead><tbody>
    ${mine.slice().reverse().map(l => { const linked = l.rid && linkedTime(l.rid) === l.t;
      return `<tr><td class="mono">${l.n}</td><td class="lt">${fmt(l.t)}</td>${rem?`<td class="mono">${l.rem!=null?fmt(l.rem):''}</td>`:''}
      <td><select id="lap-${l.n}" data-tvsel="${l.n}" ${readOnly?'disabled':''}>${ridOptions(l.rid, lapStage(l))}</select> ${linked ? '<span class="linked">● 반영됨</span>' : ''}</td>
      <td><button class="tv-b" data-tv="dellap" data-n="${l.n}" aria-label="삭제">×</button></td></tr>`; }).join('')}</tbody></table>` + more;
}
function linkTime(rid, t){ if (rid.startsWith('P4-')) { setP4Team(rid.slice(3), { time:t }); render(); } else setRun(rid, { time:t }); }
function addLap(rid){
  const el = elapsed(), t = trunc1(el), n = (T.laps.reduce((m,l) => Math.max(m,l.n), 0)) + 1;
  T.laps.push({ n, t, rem: T.mode === 'cd' ? trunc1(Math.max(0, T.duration - el)) : null, rid: rid || '', stage: T.stage });
  saveTv();
  if (rid) { const tid = ridTeam(rid), prev = linkedTime(rid), nm = team(tid).name; linkTime(rid, t); toast(`${stageLabel(rid.startsWith('P4') ? 'P4' : rid[0]==='F' ? 'F' : team(tid).group)} ${nm} ${fmt(t)} 기록${prev != null && prev !== t ? ' (이전 '+fmt(prev)+' 덮어씀)' : ''}`); }
  else toast(`기록 #${n} ${fmt(t)}`);
  renderTvLaps();
}
function tvAct(a, el){
  if (a === 'start') {
    if (T.running) { T.base = elapsed(); T.running = false; }
    else { if (!started()) armFired(); T.startPerf = nowS(); T.running = true; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch(e){} }
    updCtrl();
  }
  else if (a === 'reset') { T.running = false; T.base = 0; T.fired = {}; $('#tvBanner').hidden = true; updCtrl(); }
  else if (a === 'lap') { if (started()) addLap(''); }
  else if (a === 'team') { if (started() && !readOnly) addLap(el.dataset.rid); }
  else if (a === 'mode') { if (!started()) { T.mode = el.dataset.v; saveTv(); updCtrl(); } }
  else if (a === 'dur') { T.duration = +el.dataset.v; saveTv(); updCtrl(); }
  else if (a === 'lim') { T.limit = +el.dataset.v; saveTv(); updCtrl(); }
  else if (a === 'stage') { T.stage = el.dataset.v; T.light = T.stage === 'P4'; T.lvl = '_'; tick(); saveTv(); renderTvStage(); renderTvTeams(); renderTvLaps(); }
  else if (a === 'light') { T.light = !T.light; saveTv(); T.lvl = '_'; updCtrl(); }
  else if (a === 'fx') { T.fx = !T.fx; saveTv(); T.lvl = '_'; updCtrl(); }
  else if (a === 'sound') { T.sound = !T.sound; saveTv(); updCtrl(); if (T.sound) beep(1); }
  else if (a === 'fs') {
    const v = $('#timerView');
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if (v.requestFullscreen) v.requestFullscreen().catch(() => toast('이 화면에서는 전체 화면을 쓸 수 없습니다. 브라우저 확대(⌘/Ctrl +)를 이용하세요.'));
    else toast('이 화면에서는 전체 화면을 쓸 수 없습니다.');
  }
  else if (a === 'dellap') { T.laps = T.laps.filter(l => l.n !== +el.dataset.n); saveTv(); renderTvLaps(); }
  else if (a === 'clearlaps') { T.laps = []; saveTv(); renderTvLaps(); }
}
$('#timerView').addEventListener('click', e => { const b = e.target.closest('[data-tv]'); if (b && !b.disabled) tvAct(b.dataset.tv, b); });
$('#timerView').addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'tvCustom') { const v = parseTime(el.value); if (!v) { toast('시간을 분:초로 입력하세요. 예: 7:30'); el.value = fmt(T.duration); return; } T.duration = v; saveTv(); updCtrl(); }
  if (el.id === 'tvP4') { T.p4cur = el.value; saveTv(); renderTvNow(); return; }
  if (el.dataset.tvsel) { const l = T.laps.find(x => x.n === +el.dataset.tvsel); if (!l) return; if (el.value && !stageTeams(lapStage(l)).some(x => x.rid === el.value)) { toast('이 기록은 ' + stageLabel(lapStage(l)) + ' 팀에만 연동할 수 있습니다.'); el.value = l.rid || ''; return; } l.stage = lapStage(l); l.rid = el.value; saveTv();
    if (el.value) { linkTime(el.value, l.t); toast(`${el.options[el.selectedIndex].text} ← ${fmt(l.t)} 연동`); }
    el.blur(); renderTvLaps(); }
});
document.addEventListener('keydown', e => {
  if (ui.tab !== 'timer' || e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (!$('#tvStart').disabled) tvAct('start'); }
  else if (e.key === 'Enter') { e.preventDefault(); tvAct('lap'); }
  else if (/^[1-6]$/.test(e.key)) { const x = stageTeams(T.stage)[+e.key - 1]; if (x && started() && !readOnly) addLap(x.rid); }
});
document.addEventListener('keydown', e => {
  if (ui.tab !== 'programs' || !QZ[ui.prog] || e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { if (qView(ui.prog) !== 'live') return; e.preventDefault(); stepQuiz(ui.prog, e.key === 'ArrowRight' ? 1 : -1); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawBracket));
document.addEventListener('fullscreenchange', () => { const b = document.querySelector('[data-tv="fs"]'); if (b) b.textContent = document.fullscreenElement ? '전체 화면 닫기' : '전체 화면'; });

/* ---------- boot ---------- */
render(); updCtrl(); requestAnimationFrame(loop);
function seedDocs(){
  const out = [], put = (p, o) => { if (o) out.push([p, o]); }, each = (col, obj) => Object.entries(obj || {}).forEach(([k,v]) => put(col+'/'+k, v));
  put('meta/config', EMBED.config); each('teams', EMBED.teams); each('runs', EMBED.runs); each('scores', EMBED.scores);
  each('p2marks', EMBED.marks); put('quiz/items', EMBED.quiz); each('p5marks', EMBED.marks5); put('quiz/p5', EMBED.quiz5);
  put('p4/meta', EMBED.p4meta); each('p4teams', EMBED.p4teams); each('p4scores', EMBED.p4scores);
  put('p3/meta', EMBED.p3meta); each('p3teams', EMBED.p3teams); each('p3scores', EMBED.p3scores);
  return out;
}
async function connectFirebase(){
  const C = window.FIREBASE_CONFIG;
  if (!C || !C.apiKey || C.apiKey.startsWith('여기에') || !window.firebase) return null;
  firebase.initializeApp(C);
  try { await firebase.auth().signInAnonymously(); } catch(e){ console.warn('anonymous sign-in failed', e); }
  const fs = firebase.firestore();
  const clean = o => JSON.parse(JSON.stringify(o));
  const api = {
    doc: p => { const r = fs.doc(p); return { set: o => r.set(clean(o)), delete: () => r.delete(), onSnapshot: (n, e) => r.onSnapshot(n, e) }; },
    collection: p => fs.collection(p),
  };
  const first = await fs.doc('meta/config').get();
  if (!first.exists) {
    const docs = seedDocs();
    for (let k = 0; k < docs.length; k += 400) { const b = fs.batch(); docs.slice(k, k+400).forEach(([p,o]) => b.set(fs.doc(p), clean(o))); await b.commit(); }
    toast('처음 연결: 현재 데이터를 공유 저장소에 올렸습니다.');
  }
  return api;
}
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db) { try { db = await connectFirebase(); } catch(e){ console.error(e); db = null; toast('공유 저장소에 연결하지 못했습니다. 설정(firebase-config)을 확인하세요.'); } }
  if (!db) { mode = 'local'; render(); return; }
  mode = 'live';
  try { if (window.claude && window.claude.use) { const user = await window.claude.use('user'); if (user && user.can) { const ok = await user.can('data.write'); if (ok === false) readOnly = true; } } } catch(e){}
  const onErr = e => { console.error(e); if (e && (e.code === 'revoked' || e.code === 'permission-denied')) { mode = 'local'; render(); toast('공유 저장소 권한이 없어 이 브라우저에만 저장합니다.'); } };
  db.doc('meta/config').onSnapshot(s => { state.config = s.exists ? { ...s.data() } : {}; saveLocal(); render(); }, onErr);
  db.collection('teams').onSnapshot(s => { state.teams = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('runs').onSnapshot(s => { state.runs = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('scores').onSnapshot(s => { state.scores = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('quiz').onSnapshot(s => { const m = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); state.quiz = m.items || null; state.quiz5 = m.p5 || null; saveLocal(); render(); }, onErr);
  db.collection('p5marks').onSnapshot(s => { state.marks5 = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('p4').onSnapshot(s => { const m = s.docs.find(d => d.id === 'meta'); state.p4meta = m ? { ...m.data() } : null; saveLocal(); render(); }, onErr);
  db.collection('p3').onSnapshot(s => { const m = s.docs.find(d => d.id === 'meta'); state.p3meta = m ? { ...m.data() } : null; saveLocal(); render(); }, onErr);
  db.collection('p3teams').onSnapshot(s => { state.p3teams = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('p3scores').onSnapshot(s => { state.p3scores = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('p4teams').onSnapshot(s => { state.p4teams = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('p4scores').onSnapshot(s => { state.p4scores = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  db.collection('p2marks').onSnapshot(s => { state.marks = Object.fromEntries(s.docs.map(d => [d.id, { ...d.data() }])); saveLocal(); render(); }, onErr);
  render();
})();
})();
